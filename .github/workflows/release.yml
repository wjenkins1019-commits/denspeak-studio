name: Release (Windows)

on:
  push:
    tags:
      - 'v*'
  # Manual runs are dry runs: build and test only, no Release is created.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The "what changed" list and the compare link come from the commits
          # between the previous tag and this one, so the whole tag history is
          # needed here.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check tag matches package.json version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($tag -ne $pkg) { Write-Error "Tag v$tag does not match package.json version $pkg"; exit 1 }
          Write-Host "Version $pkg matches tag."

      - name: Build Windows installer
        run: npm run dist:win

      # Writes release-notes.md (the body actually uploaded) and
      # release/<installer>.sha256, both derived from the built artifact.
      - name: Write release notes and installer checksum
        if: github.event_name == 'push'
        run: node scripts/release-notes.mjs

      # Guards the 0.3.4 bug: the sidecar must name the exact file that gets
      # uploaded, or `sha256sum -c` fails for anyone who downloads the pair.
      - name: Verify checksum names the published installer
        if: github.event_name == 'push'
        run: node scripts/verify-release-assets.mjs

      - name: Attach installer and checksum to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.sha256
          fail_on_unmatched_files: true
          # The generated body leads and already ends with GitHub's compare link.
          body_path: release-notes.md
          generate_release_notes: false
