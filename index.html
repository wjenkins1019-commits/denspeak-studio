<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071a33" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/icons/icon-256.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta
      name="description"
      content="Denspeak Studio narrates with on-device voices in 36 languages, shapes takes with EQ presets and changes a recording's gender or tone — free, no account."
    />
    <title>Denspeak Studio — voice studio</title>
    <script>
      // Restore the saved theme before paint, so a light UI never flashes dark.
      try {
        var savedTheme = JSON.parse(localStorage.getItem('chatterbox.theme') || '"dark"');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {
        /* No storage: keep the dark default from the html tag. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
