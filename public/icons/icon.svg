<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Denspeak Studio">
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0e2a4d" />
      <stop offset="0.55" stop-color="#081a31" />
      <stop offset="1" stop-color="#040d1a" />
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#5aa8ff" stop-opacity="0.42" />
      <stop offset="0.55" stop-color="#5aa8ff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#5aa8ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ink" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#9cf0ff" />
      <stop offset="0.5" stop-color="#5ab4ff" />
      <stop offset="1" stop-color="#3f7dff" />
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061427" />
      <stop offset="1" stop-color="#040d1a" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)" />
  <rect width="512" height="512" rx="116" fill="url(#sheen)" />

  <!-- speech bubble with a tail, filled in the accent gradient -->
  <rect x="112" y="132" width="288" height="196" rx="86" fill="url(#ink)" />
  <path d="M166 296 L146 376 L232 326 Z" fill="url(#ink)" />

  <!-- waveform cut out of the bubble -->
  <g fill="url(#slot)">
    <rect x="169" y="207" width="24" height="46" rx="12" />
    <rect x="219" y="184" width="24" height="92" rx="12" />
    <rect x="269" y="166" width="24" height="128" rx="12" />
    <rect x="319" y="194" width="24" height="72" rx="12" />
  </g>
</svg>
